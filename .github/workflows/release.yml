name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      platform:
        description: 'Target platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mac
          - win

permissions:
  contents: write

jobs:
  # Run typecheck & tests on cheap Linux (1x) first so failing builds never burn macOS/Windows minutes
  verify:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  build-mac:
    name: Build macOS (.dmg arm64 + x64)
    needs: verify
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'mac'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Package macOS DMGs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run pack:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (.exe x64)
    needs: verify
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'win'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Package Windows Installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: win-installers
          path: dist/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [verify, build-mac, build-windows]
    if: always() && needs.verify.result == 'success' && (needs.build-mac.result == 'success' || needs.build-windows.result == 'success') && needs.build-mac.result != 'failure' && needs.build-windows.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          name: Portfolio Pulse ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## Portfolio Pulse — Local-First Indian Portfolio Tracker

            ### Downloads
            - **macOS (Apple Silicon M1/M2/M3/M4):** `portfolio-pulse-*-arm64.dmg`
            - **macOS (Intel):** `portfolio-pulse-*-x64.dmg`
            - **Windows (64-bit):** `portfolio-pulse-*-setup.exe`

            ### Installing Unsigned Preview Builds
            - **macOS:** Open the `.dmg`, drag **Portfolio Pulse** to **Applications**, then run this once in Terminal to clear the browser quarantine flag:
              ```bash
              xattr -cr "/Applications/Portfolio Pulse.app"
              ```
              *(After running this once, open Portfolio Pulse normally from Applications.)*
            - **Windows:** On SmartScreen, click **More info → Run anyway**.

            ### Getting Started
            - **100% Local-First:** Zero backend servers — OAuth tokens and optional BYOK AI keys (Claude, Gemini, OpenAI, Ollama) are encrypted in your OS Keychain / Credential Manager.
            - For the most complete tracking across all asset classes, link/record all holdings in **INDmoney** first, then connect **INDmoney**, **Upstox**, or both inside the app.
            - Want to explore before linking accounts? Click **Try Demo Portfolio First** on onboarding.
